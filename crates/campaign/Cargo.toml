[package]
name = "phoenix-campaign"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "Offline, paper-only strategy research campaigns: causal views, strategy families, bounded search, chronological validation."

[dependencies]
phoenix-domain = { path = "../domain" }
phoenix-sim = { path = "../sim" }
phoenix-research = { path = "../research" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "phoenix-campaign"
path = "src/bin/phoenix-campaign.rs"
