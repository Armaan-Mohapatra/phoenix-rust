[package]
name = "phoenix-collector-adapter"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Read-only adapter for the native Kalshi collector's per-market book feed: replays WS snapshot + deltas and checks every step against the collector's own recorded quotes."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "phoenix-collector-parity"
path = "src/bin/phoenix-collector-parity.rs"
