[package]
name = "phoenix-performance-report"
version = "0.1.0"
publish = false
edition = "2021"
rust-version="1.78" # no locked dependency requires newer Rust

[workspace]

[dependencies]
phoenix-domain = { path = "../../crates/domain" }
phoenix-pipeline = { path = "../../crates/pipeline" }
phoenix-research = { path = "../../crates/research" }
phoenix-strategies = { path = "../../crates/strategies" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
