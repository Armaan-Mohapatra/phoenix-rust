[package]
name="phoenix-source-loader"
version="0.1.0"
publish=false
edition="2021"
rust-version="1.85" # minimum required by locked dependency: getrandom 0.4.3

[workspace]

[dependencies]
phoenix-kalshi-wire={path="../kalshi-wire"}
phoenix-domain={path="../../crates/domain"}
phoenix-sim={path="../../crates/sim"}
phoenix-historical-input={path="../historical-input"}
arrow-array="53.4.0"
parquet={version="53.4.0",default-features=false,features=["arrow","zstd"]}
bytes="1"
chrono="0.4"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
zip={version="0.6",default-features=false,features=["deflate"]}

[dev-dependencies]
arrow-schema="53.4.0"
tempfile="3"
