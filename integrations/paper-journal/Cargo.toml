[package]
name = "phoenix-paper-journal"
version = "0.1.0"
publish = false
edition = "2021"
rust-version="1.85" # minimum required by locked dependency: getrandom 0.4.3

[workspace]

[dependencies]
phoenix-parquet-batch = { path = "../parquet-batch" }
phoenix-durable-archive = { path = "../durable-archive" }
phoenix-sim = { path = "../../crates/sim" }
phoenix-risk-guard = { path = "../risk-guard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
