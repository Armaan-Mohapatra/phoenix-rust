name: Rust vertical synthetic replay integration
on:
  push:
    branches: [codex/integrated-replay-fixture-v1]
    paths: ['integrations/vertical-fixture/**','.github/workflows/vertical-fixture.yml']
  pull_request:
    paths: ['integrations/vertical-fixture/**','.github/workflows/vertical-fixture.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path integrations/vertical-fixture/Cargo.toml
