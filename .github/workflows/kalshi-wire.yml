name: Rust Kalshi message decoder tests
on:
  push:
    branches: [codex/kalshi-wire-codec-v1]
    paths: ['integrations/kalshi-wire/**','.github/workflows/kalshi-wire.yml']
  pull_request:
    paths: ['integrations/kalshi-wire/**','.github/workflows/kalshi-wire.yml']
permissions:
  contents: read
jobs:
  decoder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path integrations/kalshi-wire/Cargo.toml
